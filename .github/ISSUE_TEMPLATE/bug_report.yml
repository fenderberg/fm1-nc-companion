name: Bug report
description: Something in NCC doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report NCC bugs here. Check the [current manual](https://github.com/fenderberg/fm1-nc-companion/blob/main/docs/MANUAL.md) first.
        Please distinguish public release 0.3 from the current development source; they have different features.
  - type: input
    id: version
    attributes:
      label: NCC release or development revision
      description: Include the release number or git commit. Development builds share FM-1_700; the identity alone is not enough.
      placeholder: "0.3 / FM-1_703, or development commit and FM-1_700"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
